name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'vercel.json'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (action-setup
      # errors if both that field and a version input are specified)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test
      - run: pnpm turbo run build --filter=@sniffoutpro/web

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (action-setup
      # errors if both that field and a version input are specified)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drizzle migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — skipping migrate (DDL currently applied via Supabase MCP)"
            exit 0
          fi
          # Reconcile the migration ledger for schema that predates it
          # (0000 via early tooling, 0001 via Supabase MCP) — idempotent.
          node scripts/migrate-baseline.mjs
          pnpm --filter @sniffoutpro/db db:migrate

  deploy:
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (action-setup
      # errors if both that field and a version input are specified)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Post-deploy smoke (verify-production)
        env:
          SNIFFOUT_SYNC_TOKEN: ${{ secrets.SNIFFOUT_SYNC_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://sniffoutpro-web.vercel.app' }}
        run: node scripts/verify-production.mjs "$PRODUCTION_URL" "$SNIFFOUT_SYNC_TOKEN"
